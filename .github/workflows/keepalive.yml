name: Radio Keep-Alive

# Se ejecuta automáticamente cada 10 minutos, y también se puede
# lanzar manualmente desde la pestaña "Actions" del repo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # necesario para que el paso de auto-commit mensual pueda hacer push

jobs:
  ping-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el repositorio (necesario para poder hacer commit despues)
        uses: actions/checkout@v4

      - name: Mantener conexion abierta en ambas radios (~9 de cada 10 minutos)
        run: |
          set -e

          # Segundos que se mantiene cada conexion abierta por corrida.
          # 540s = 9 minutos, dejando ~1 minuto de margen antes de que
          # arranque la siguiente corrida programada cada 10 minutos.
          HOLD_SECONDS=540

          STATIONS=(
            "https://eu8.fastcast4u.com/proxy/carloshernandez2?mp=/1"
            "http://51.255.235.165:3488/stream?type=http&nocache=1"
          )

          PIDS=()
          for URL in "${STATIONS[@]}"; do
            echo "Abriendo conexion a: $URL (hasta ${HOLD_SECONDS}s)"
            (
              timeout "$HOLD_SECONDS" curl -s -A "Mozilla/5.0 (KeepAliveBot/1.0)" -o /dev/null "$URL" \
                || echo "Aviso: conexion a $URL termino antes de tiempo (puede estar caida temporalmente)"
            ) &
            PIDS+=($!)
          done

          # Espera a que ambas conexiones terminen (o lleguen al timeout)
          for PID in "${PIDS[@]}"; do
            wait "$PID"
          done

          echo "Keep-alive de streams completado."

      - name: Visitar la pagina (hosting rf.gd, evita suspension por falta de visitas)
        run: |
          # InfinityFree/rf.gd suspende sitios gratuitos que no reciben
          # visitas reales por un tiempo. Esta peticion simula una visita.
          PAGE_URL="http://radios-games.rf.gd/?i=1"
          echo "Visitando: $PAGE_URL"
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -o /dev/null -w "Status: %{http_code}\n" "$PAGE_URL" || \
            echo "Aviso: no se pudo visitar la pagina (puede estar caida temporalmente)"

      - name: Auto-commit mensual (evita que GitHub desactive el workflow tras 60 dias sin actividad)
        run: |
          # GitHub apaga automáticamente los workflows "schedule" si el repo
          # no tiene NINGÚN commit en 60 días. Este paso solo hace un commit
          # real una vez al mes (día 1), actualizando un archivo de log.
          # El resto de los días no hace nada.
          TODAY=$(date -u +%d)
          if [ "$TODAY" = "01" ]; then
            mkdir -p .keepalive
            echo "Ultimo ping: $(date -u)" > .keepalive/last-run.log

            git config user.name "radio-keepalive-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .keepalive/last-run.log
            git commit -m "chore: keep-alive monthly heartbeat" || echo "Nada que commitear"
            git push
          else
            echo "Hoy no toca commit mensual (solo se hace el dia 1)."
          fi
